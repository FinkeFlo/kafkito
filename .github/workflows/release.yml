name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Fails the release before anything is built or published unless
  # frontend/src/content/changelog.ts has a dated entry for this tag.
  release-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Check changelog entry for ${{ github.ref_name }}
        run: make release-check VERSION=${{ github.ref_name }}

  # Binaries, archives, SHA256SUMS, SBOMs, multi-arch images and the GitHub
  # release with generated notes; see .goreleaser.yaml.
  goreleaser:
    needs: release-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags for the changelog and version detection.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # Minor line from go.mod; resolves to the latest patch release, like
          # the golang:1.26-alpine image in the Dockerfile. go-version-file would
          # pin the exact go.mod minimum (1.26.0) and miss security patches.
          go-version: "1.26"
      - uses: oven-sh/setup-bun@v2
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
