name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        tags: ["", "btp"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Minor line from go.mod; resolves to the latest patch release, like
          # the golang:1.26-alpine image in the Dockerfile. go-version-file would
          # pin the exact go.mod minimum (1.26.0) and miss security patches.
          go-version: "1.26"
      - run: go build -tags "${{ matrix.tags }}" ./...
      - run: go test -race -tags "${{ matrix.tags }}" ./...
      - if: matrix.tags == ''
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # api/openapi.yaml is the HTTP contract (ADR-0005). Keep the Redocly
      # version in sync with REDOCLY_VERSION in the Makefile.
      - name: Lint OpenAPI spec
        working-directory: .
        run: bunx @redocly/cli@2.54.3 lint api/openapi.yaml
      - name: Check generated API types are up to date
        run: |
          bun run api:generate
          git diff --exit-code -- src/lib/api.gen.ts
      - run: bun run lint
      - run: bun run build
      - run: bun run test

  api-breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Extract base spec
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mkdir -p .oasdiff-base
          if git cat-file -e "$BASE_SHA:api/openapi.yaml" 2>/dev/null; then
            git show "$BASE_SHA:api/openapi.yaml" > .oasdiff-base/openapi.yaml
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::api/openapi.yaml does not exist on the PR base; skipping the breaking-change check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for breaking API changes
        if: steps.base.outputs.present == 'true'
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b # v0.1.17
        with:
          base: .oasdiff-base/openapi.yaml
          revision: api/openapi.yaml
          fail-on: ERR
          # Keep the specs inside CI: no upload to oasdiff.com, no PR comment.
          review: "false"
          github-token: ""

  docker-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_tags: ["", "btp"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker build --build-arg BUILD_TAGS="${{ matrix.build_tags }}" -t "kafkito:ci-${{ matrix.build_tags || 'default' }}" .

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: tisonkun/actions-dco@v1.1
