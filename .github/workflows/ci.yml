name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        tags: ["", "btp"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - run: go build -tags "${{ matrix.tags }}" ./...
      - run: make test TAGS="${{ matrix.tags }}"
      # Equivalent of `make lint` for this matrix entry. The action is kept
      # over `make lint` for its PR annotations and lint cache; its version
      # must equal GOLANGCI_LINT_VERSION in the Makefile (checked below).
      # Build tags change the compiled file set, so lint every matrix entry.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ${{ matrix.tags && format('--build-tags={0}', matrix.tags) || '' }}
      - if: matrix.tags == ''
        run: make lint-version-check
      # Validates .goreleaser.yaml (the release pipeline) on every PR.
      - if: matrix.tags == ''
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Keep in sync between ci.yml and release.yml.
          version: "~> v2.18"
          args: check

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          frontend-deps: "true"
      # OpenAPI lint + generated API types drift check (ADR-0005).
      - run: make api-check
      - run: make frontend-check

  api-breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Extract base spec
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mkdir -p .oasdiff-base
          if git cat-file -e "$BASE_SHA:api/openapi.yaml" 2>/dev/null; then
            git show "$BASE_SHA:api/openapi.yaml" > .oasdiff-base/openapi.yaml
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::api/openapi.yaml does not exist on the PR base; skipping the breaking-change check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for breaking API changes
        if: steps.base.outputs.present == 'true'
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b # v0.1.17
        with:
          base: .oasdiff-base/openapi.yaml
          revision: api/openapi.yaml
          fail-on: ERR
          # Keep the specs inside CI: no upload to oasdiff.com, no PR comment.
          review: "false"
          github-token: ""

  docker-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_tags: ["", "btp"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: BUILD_TAGS=${{ matrix.build_tags }}
          tags: kafkito:ci-${{ matrix.build_tags || 'default' }}
          push: false
          # One cache scope per variant so they don't evict each other.
          cache-from: type=gha,scope=docker-${{ matrix.build_tags || 'default' }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.build_tags || 'default' }}

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: tisonkun/actions-dco@v1.1
