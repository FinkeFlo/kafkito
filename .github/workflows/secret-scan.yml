name: Secret Scan
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.97.0
        with:
          extra_args: --results=verified,unknown

  # Server-side mirror of the local pre-commit/pre-push denylist guard.
  # The token list lives only in the DENYLIST_REGEX Actions secret (a
  # pipe-separated body such as "foo|bar|baz[0-9]{4,6}"), never in this repo,
  # so internal/partner identifiers stay out of the public source. The
  # secret is maintained out-of-band; do not hard-code patterns here.
  denylist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Scan tree for denylisted identifiers
        env:
          DENYLIST_REGEX: ${{ secrets.DENYLIST_REGEX }}
        run: |
          set -euo pipefail
          if [ -z "${DENYLIST_REGEX:-}" ]; then
            echo "::notice::DENYLIST_REGEX secret not available (e.g. fork PR); skipping denylist scan."
            exit 0
          fi
          REGEX="\\b(${DENYLIST_REGEX})\\b"
          # Match the local guard: all text files (-I), same dir excludes,
          # tolerate partner names only in legal text (LICENSE, NOTICE).
          set +e
          HITS=$(grep -rinIE \
            --exclude-dir='.git' \
            --exclude-dir='node_modules' \
            --exclude-dir='dist' \
            --exclude-dir='.vite' \
            --exclude-dir='coverage' \
            --exclude-dir='vendor' \
            --exclude='LICENSE' \
            --exclude='NOTICE' \
            "$REGEX" . 2>/dev/null)
          set -e
          if [ -n "$HITS" ]; then
            echo "::error::Denylisted internal/partner identifiers found. Scrub them before merging."
            # Print only file:line — never echo the matched token value into public logs.
            echo "$HITS" | cut -d: -f1,2 | sort -u
            exit 1
          fi
          echo "denylist scan: clean"
