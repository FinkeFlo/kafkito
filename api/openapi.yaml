openapi: 3.1.0
info:
  title: kafkito REST API
  version: "1"
  summary: Read/write access to Kafka clusters managed by kafkito.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    JSON surface that backs the kafkito web UI. It is primarily a UI
    contract, but stable enough for scripting with `curl`.

    This document is the single source of truth for the HTTP contract
    (ADR-0005). The frontend TypeScript types are generated from it and a Go
    test asserts that every registered route is described here.

    Authentication: every `/api/v1/*` request is validated by kafkito's auth
    middleware. Depending on `KAFKITO_AUTH_MODE` it expects an
    `Authorization: Bearer <JWT>` header (`mock`, `xsuaa` in `-tags btp`
    builds) and answers 401 when it is missing or invalid, or injects a
    synthetic principal (`off`, `-tags devauth` builds only). kafkito has no
    login flow of its own:
    interactive login is handled by an upstream auth proxy (for example the
    SAP approuter), which forwards the bearer token. The validated principal
    feeds the optional RBAC policy. `/healthz` and `/readyz` are never
    authenticated.

    Private (browser-stored) clusters: use the cluster path segment
    `__private__` and send the cluster definition base64-encoded in the
    `X-Kafkito-Cluster` header. Such requests bypass RBAC; only the broker's
    own ACLs apply.

    Conventions:
    - List endpoints return objects (`{ "<resource>": [...] }`), never bare
      arrays, so new top-level fields can be added without breaking clients.
    - Timestamps are Unix milliseconds (int64) unless noted otherwise.
    - Error responses use the `Error` schema: `{ "error": "<message>" }`,
      optionally with a machine-readable `code`.
    - Every response carries an `X-Request-Id` header (see
      `components.headers.RequestId`).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: meta
    description: Build info, readiness, identity.
  - name: clusters
    description: Cluster inventory, brokers and capabilities.
  - name: topics
    description: Topic listing, describe, create, delete, configs.
  - name: messages
    description: Consume, produce, search, count and copy records.
  - name: groups
    description: Consumer groups, members, offsets, reset.
  - name: schemas
    description: Schema Registry subjects and versions.
  - name: acls
    description: Kafka ACLs.
  - name: users
    description: SCRAM users.
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [meta]
      summary: Liveness probe.
      security: []
      responses:
        "200":
          description: Service is alive.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /readyz:
    get:
      operationId: getReadiness
      tags: [meta]
      summary: Readiness probe. 503 if any configured cluster is unreachable.
      security: []
      responses:
        "200":
          description: All clusters reachable, or no clusters configured.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }
        "503":
          description: At least one configured cluster is unreachable.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }
  /api/v1/info:
    get:
      operationId: getInfo
      tags: [meta]
      summary: Build info.
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfoResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me:
    get:
      operationId: getMe
      tags: [meta]
      summary: Resolved caller identity and effective permissions.
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenApiSpec
      tags: [meta]
      summary: This OpenAPI document.
      responses:
        "200":
          description: The raw OpenAPI 3.1 document.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/clusters:
    get:
      operationId: listClusters
      tags: [clusters]
      summary: List configured clusters with reachability, capabilities and metrics.
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListClustersResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/clusters/_test:
    post:
      operationId: testCluster
      tags: [clusters]
      summary: Probe an ad-hoc cluster definition without storing it.
      description: |
        Validates a user-supplied cluster definition, pings the brokers and
        runs a short capability probe. The definition is taken from the
        request body or, when the body is empty, from the `X-Kafkito-Cluster`
        header (the body wins). A failed ping is **not** an HTTP error: the
        response is 200 with `reachable: false` and the raw connection error
        in `error`, because diagnosing the caller's own broker is the point of
        this endpoint. The probe budget defaults to 15 s
        (`KAFKITO_TEST_CONNECTION_TIMEOUT`).
      parameters:
        - $ref: "#/components/parameters/PrivateClusterHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterConfig" }
      responses:
        "200":
          description: Probe finished (see `reachable`).
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/clusters/{cluster}/capabilities:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    get:
      operationId: getCapabilities
      tags: [clusters]
      summary: Cached capabilities (permissions probed against the broker).
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilitiesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/capabilities/refresh:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    post:
      operationId: refreshCapabilities
      tags: [clusters]
      summary: Re-probe capabilities (clears the cache).
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilitiesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/brokers:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    get:
      operationId: listBrokers
      tags: [clusters]
      summary: List the brokers of a cluster.
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListBrokersResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/topics:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    get:
      operationId: listTopics
      tags: [topics]
      summary: List topics (filtered by RBAC view permission).
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListTopicsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
    post:
      operationId: createTopic
      tags: [topics]
      summary: Create a topic.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTopicRequest" }
      responses:
        "201":
          description: Created
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/topics/{topic}:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/Topic"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    get:
      operationId: describeTopic
      tags: [topics]
      summary: Describe a single topic (partitions, offsets, configs).
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DescribeTopicResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
    delete:
      operationId: deleteTopic
      tags: [topics]
      summary: Delete a topic.
      parameters:
        - $ref: "#/components/parameters/ProdConfirmHeader"
      responses:
        "200":
          description: Deleted
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedNameResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "428": { $ref: "#/components/responses/ProdConfirmationRequired" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/topics/{topic}/consumers:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/Topic"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    get:
      operationId: listTopicConsumers
      tags: [topics]
      summary: Consumer groups that have committed offsets on, or are assigned to, this topic.
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListTopicConsumersResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504":
          description: 'Listing consumers timed out (`code: topic_consumers_timeout`).'
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/clusters/{cluster}/topics/{topic}/configs:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/Topic"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    patch:
      operationId: alterTopicConfigs
      tags: [topics]
      summary: Incrementally set and/or delete topic config entries.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlterTopicConfigsRequest" }
      responses:
        "200":
          description: Per-entry results.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlterTopicConfigsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/topics/{topic}/records:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/Topic"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    delete:
      operationId: deleteRecords
      tags: [topics]
      summary: Delete records up to an offset per partition (low-watermark bump).
      parameters:
        - $ref: "#/components/parameters/ProdConfirmHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteRecordsRequest" }
      responses:
        "200":
          description: Per-partition results.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteRecordsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "428": { $ref: "#/components/responses/ProdConfirmationRequired" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/topics/{topic}/messages:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/Topic"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    get:
      operationId: consumeMessages
      tags: [messages]
      summary: Browse a bounded page of messages.
      description: |
        Reads at most `limit` messages (capped at 500 server-side). Values are
        decoded into `value` when printable; binary values are rendered as a
        hex preview with the raw bytes in `value_b64`. Schema-Registry encoded
        records are decoded transparently when a Schema Registry is configured
        for the cluster. Large values are truncated for the list view
        (`value_truncated`); fetch the full bytes via the raw endpoint.

        Paging: pass the returned `next_cursor` back as `cursor`. A cursor
        forces the seek mode to its direction (backward → `from=end`, forward
        → `from=offset`); an explicit contradicting `from` returns 400.
      parameters:
        - $ref: "#/components/parameters/PartitionQuery"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 50 }
          description: Page size. Values above 500 are clamped to 500.
        - in: query
          name: from
          schema: { type: string, enum: [end, start, offset, timestamp], default: end }
          description: >
            Seek mode. `end` = newest records, `start` = oldest, `offset` =
            from `offset` (single partition) or `partition_offsets`,
            `timestamp` = first record at or after `from_ts_ms`.
        - in: query
          name: offset
          schema: { type: integer, format: int64 }
          description: Required when `from=offset` and `partition_offsets` is not set.
        - in: query
          name: partition_offsets
          schema: { type: string, example: "0:120,1:98" }
          description: >
            Per-partition seek offsets as `p:o,p:o` (max 1024 entries). Only
            valid with `from=offset`.
        - $ref: "#/components/parameters/FromTsMsQuery"
        - $ref: "#/components/parameters/ToTsMsQuery"
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque continuation token from a previous `next_cursor`.
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagesPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
    post:
      operationId: produceMessage
      tags: [messages]
      summary: Produce a single record.
      description: |
        `key_encoding` / `value_encoding` select how `key` / `value` are turned
        into record bytes:
        - `text` (default): the string is sent as UTF-8 bytes. An **empty**
          `text` value produces a **nil** payload, i.e. a tombstone — which
          deletes the key on a compacted topic.
        - `base64`: the string is base64-decoded (standard, URL-safe or raw
          standard are all accepted), for arbitrary binary payloads. An empty
          string produces a nil payload here too.
        - `empty`: the string is ignored and a non-nil **zero-length** payload
          is produced. Needed because `text` cannot express a zero-length
          payload (see the tombstone semantics above).

        Header values that are not valid UTF-8 cannot round-trip through
        `headers`; pass them as base64 raw bytes in `headers_b64` instead. A key
        present in both maps wins in `headers_b64` and is emitted exactly once.
        An undecodable `headers_b64` value fails the request with 400.

        kafkito always injects the provenance headers `X-Kafkito-Source: true`
        and, when an identity is available, `X-Kafkito-User: <subject>`,
        overwriting those keys if the request supplied them.

        The body may be sent gzip-compressed with `Content-Encoding: gzip`.
        The decompressed body is capped at 15 MiB either way; unknown JSON
        fields are rejected.
      parameters:
        - $ref: "#/components/parameters/ProdConfirmHeader"
        - in: header
          name: Content-Encoding
          required: false
          schema: { type: string, enum: [gzip] }
          description: Set to `gzip` when the JSON body is gzip-compressed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProduceRequest" }
      responses:
        "200":
          description: Produced
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProduceResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "428": { $ref: "#/components/responses/ProdConfirmationRequired" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/topics/{topic}/messages/count:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/Topic"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    get:
      operationId: countMessages
      tags: [messages]
      summary: Approximate message volume for a topic range.
      description: |
        Resolves the selected timestamp window to per-partition offset deltas
        and returns an approximate count without consuming any records.
      parameters:
        - $ref: "#/components/parameters/PartitionQuery"
        - $ref: "#/components/parameters/FromTsMsQuery"
        - $ref: "#/components/parameters/ToTsMsQuery"
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageCountResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/topics/{topic}/messages/timeline:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/Topic"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    get:
      operationId: getMessageTimeline
      tags: [messages]
      summary: Time-sliced message volume over a time range for a topic.
      description: |
        Resolves the selected timestamp window into fixed-width time slots and
        returns an approximate message count per slot, without consuming
        any records. At most 400 slots per request.
      parameters:
        - $ref: "#/components/parameters/PartitionQuery"
        - in: query
          name: from_ts_ms
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: Inclusive lower timestamp bound in Unix milliseconds.
        - in: query
          name: to_ts_ms
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: Exclusive upper timestamp bound in Unix milliseconds. Must be greater than `from_ts_ms`.
        - in: query
          name: slot_ms
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: Time-slot width in milliseconds (e.g. 3600000 for hourly, 86400000 for daily).
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageTimelineResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/topics/{topic}/messages/{partition}/{offset}/raw:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/Topic"
      - $ref: "#/components/parameters/PrivateClusterHeader"
      - in: path
        name: partition
        required: true
        schema: { type: integer, format: int32 }
      - in: path
        name: offset
        required: true
        schema: { type: integer, format: int64, minimum: 0 }
    get:
      operationId: downloadMessageRaw
      tags: [messages]
      summary: Download the raw value bytes of a single record.
      description: |
        Streams the untouched value bytes as an attachment
        (`<topic>-p<partition>-o<offset>.<ext>`). The content type is sniffed:
        `application/json` for valid JSON, `text/plain` for other UTF-8 and
        `application/octet-stream` otherwise. Values above 15 MB are rejected
        with 413.
      responses:
        "200":
          description: Raw value bytes.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Content-Disposition:
              description: '`attachment; filename="<topic>-p<partition>-o<offset>.<ext>"`'
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/topics/{topic}/sample:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/Topic"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    get:
      operationId: sampleMessages
      tags: [messages]
      summary: Sample the last n decoded messages from a topic.
      description: |
        Returns up to `n` most recent decoded messages. Used by the search
        path-picker to build a structural sample of the topic payload. Reuses
        the consume permission for RBAC.
      parameters:
        - in: query
          name: n
          schema: { type: integer, default: 5 }
          description: Sample size; clamped to 1..25.
        - $ref: "#/components/parameters/PartitionQuery"
      responses:
        "200":
          description: Sample fetched.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/topics/{topic}/messages/search:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/Topic"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    post:
      operationId: searchMessages
      tags: [messages]
      summary: Bounded, budget-limited content search across partitions.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/topics/{topic}/copy:
    parameters:
      - $ref: "#/components/parameters/Cluster"
      - $ref: "#/components/parameters/Topic"
      - $ref: "#/components/parameters/PrivateClusterHeader"
    post:
      operationId: copyMessages
      tags: [messages]
      summary: Bulk-copy messages into another topic (SSE progress stream).
      description: |
        Server-side copy: reads records from the source topic — the
        `{cluster}`/`{topic}` in the URL — and re-produces them into
        `dest_topic` on the destination cluster named in the request body.
        The destination topic must already exist; kafkito never creates it.

        Exactly one destination cluster field must be set: `dest_cluster` for a
        server-configured cluster, or `dest_cluster_config` for an ad-hoc
        ("private") cluster passed inline — the same payload the
        `X-Kafkito-Cluster` header carries.

        The response is **not** JSON: it is a `text/event-stream` of
        `CopyProgressEvent` objects, because a copy can run far longer than a
        normal request.

        When `to_ts_ms` is omitted the server substitutes the job's start time,
        so copying a live topic terminates instead of tailing it forever:
        records produced after the copy started are not included.

        Records that cannot be reproduced byte-for-byte are left out and
        counted in `skipped` instead of being copied approximately:
        Schema-Registry-decoded payloads (`avro` / `json_schema` /
        `protobuf`), for which only the decoded JSON rendering is available and
        the original wire-format bytes are gone, and masked records, whose
        value the source cluster's `data_masking` rules replaced with a
        redacted rendering.

        Copied records carry the same provenance headers the produce endpoint
        injects — `X-Kafkito-Source: true` and `X-Kafkito-User: <subject>` —
        overwriting those keys if the source record already had them.

        Authorization: the source needs `topic:consume` (checked by the RBAC
        middleware from the URL) and the destination needs `topic:produce`
        (checked by the handler against the cluster/topic named in the body).
        An ad-hoc `dest_cluster_config` destination **bypasses RBAC** — the
        caller supplies their own broker credentials and only that broker's own
        ACLs apply, so a user holding nothing but `topic:consume` can stream a
        readable topic to a broker of their choosing. This is a deliberate,
        pre-existing property of private clusters.

        The copy is neither transactional nor resumable: on error the records
        copied so far stay in the destination topic, and re-running the copy
        duplicates them.
      parameters:
        - $ref: "#/components/parameters/ProdConfirmHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyRequest" }
      responses:
        "200":
          description: |
            Copy job started; progress is streamed as Server-Sent Events. A
            failure *during* the copy also arrives here with status 200 — the
            SSE headers are already sent — as a final event carrying `error`.
            Clients must inspect the events, not just the status code.

            Wire format: one `data: <CopyProgressEvent JSON>` line per event,
            separated by a blank line, e.g.
            `data: {"copied":500,"skipped":3}`.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/CopyProgressEvent" }
              example: { copied: 812, skipped: 5, done: true }
        "400":
          description: >
            Invalid body, missing `dest_topic`, both or neither destination
            field set, destination equal to the source cluster+topic (the copy
            would never terminate), unknown `dest_cluster`, `dest_topic` does
            not exist on the destination (the destination is never
            auto-created), or `preserve_partition` with too few partitions on
            the destination topic.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "428": { $ref: "#/components/responses/ProdConfirmationRequired" }
        "429":
          description: >
            Too many concurrent copy jobs server-wide (limit 4). The body
            carries `code: copy_concurrency_limit`. Copies are long-running and
            each holds broker connections, so the server sheds load rather than
            queueing.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Retry-After:
              description: Seconds to wait before retrying.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/groups:
    parameters:
      - $ref: "#/components/parameters/Cluster"
