        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT validated by kafkito (auth modes `mock` and `xsuaa`). In mode
        `off` (`-tags devauth` builds only) no token is required and a
        synthetic principal is used.
  headers:
    RequestId:
      description: >
        Request correlation id, set on every response. Reuses the inbound
        `X-Vcap-Request-Id`, the trace-id of a W3C `traceparent` or an inbound
        `X-Request-Id` when present (in that order), otherwise freshly
        generated. Matches the `request_id` field in the server logs.
      required: true
      schema: { type: string }
  parameters:
    Cluster:
      in: path
      name: cluster
      required: true
      schema: { type: string }
      description: >
        Cluster name from the kafkito config, or `__private__` together with
        the `X-Kafkito-Cluster` header for a browser-stored cluster.
    Topic:
      in: path
      name: topic
      required: true
      schema: { type: string }
    Group:
      in: path
      name: group
      required: true
      schema: { type: string }
    Subject:
      in: path
      name: subject
      required: true
      schema: { type: string }
    PrivateClusterHeader:
      in: header
      name: X-Kafkito-Cluster
      required: false
      schema: { type: string, contentEncoding: base64 }
      description: >
        Base64-encoded JSON `ClusterConfig` of a private (browser-stored)
        cluster, max 8 KiB decoded. Honoured when the `{cluster}` path segment
        is `__private__` (required then). RBAC is bypassed for private
        clusters. A malformed header is rejected with 400.
    ProdConfirmHeader:
      in: header
      name: X-Kafkito-Confirm-Prod
      required: false
      schema: { type: string, enum: ["true"] }
      description: >
        Must be `true` when the target cluster is marked `is_prod`; the request
        is rejected with 428 otherwise. Send only after explicit user
        confirmation.
    PartitionQuery:
      in: query
      name: partition
      schema: { type: integer, format: int32, default: -1 }
      description: "Partition number; -1 = all partitions."
    FromTsMsQuery:
      in: query
      name: from_ts_ms
      schema: { type: integer, format: int64, minimum: 0 }
      description: Optional inclusive lower timestamp bound in Unix milliseconds.
    ToTsMsQuery:
      in: query
      name: to_ts_ms
      schema: { type: integer, format: int64, minimum: 0 }
      description: Optional exclusive upper timestamp bound in Unix milliseconds.
  responses:
    BadRequest:
      description: Invalid request (parameters, body, or private-cluster header).
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid bearer token.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
        WWW-Authenticate:
          description: Always `Bearer realm="kafkito"`.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >
        RBAC denied the action (`error: forbidden` plus `resource` and
        `action`, or `code: rbac_denied`), or the broker rejected the
        credential's ACLs (`code: kafka_not_authorized`).
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown cluster, topic, or Schema Registry not configured.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Request body or record value exceeds the server-side limit.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ProdConfirmationRequired:
      description: >
        Cluster is marked `is_prod` and the `X-Kafkito-Confirm-Prod: true`
        header is missing (`code: production_confirmation_required`).
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: >
        Upstream Kafka / Schema Registry error. Details are logged
        server-side only (`code: kafka_upstream`).
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      description: Error body emitted by all JSON error paths.
      properties:
        error:
          type: string
          description: Human-readable message (`unauthorized`, `forbidden`, `not found`, ...).
        code:
          type: string
          description: >
            Machine-readable code where one exists, e.g. `kafka_upstream`,
            `production_confirmation_required`, `copy_concurrency_limit`,
            `kafka_message_too_large`, `kafka_not_authorized`, `rbac_denied`,
            `topic_consumers_timeout`.
        message:
          type: string
          description: Detail for 401 responses from the auth middleware.
        resource:
          type: string
          description: RBAC-denied resource as `<type>:<name>` (403 only).
        action:
          type: string
          description: RBAC-denied action (403 only).
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    ReadinessResponse:
      type: object
      required: [status, clusters]
      properties:
        status: { type: string, enum: [ok, ready, degraded] }
        clusters:
          type: array
          items: { $ref: "#/components/schemas/ClusterInfo" }
        note:
          type: string
          description: Set when no clusters are configured.
    InfoResponse:
      type: object
      required: [name, version]
      properties:
        name: { type: string }
        version: { type: string }
    MeResponse:
      type: object
      required: [user, email, tenant, scopes, roles, permissions, anonymous, jwt, rbac_enabled]
      properties:
        user: { type: string, description: Resolved RBAC subject; empty when anonymous. }
        email: { type: string }
        tenant: { type: string }
        scopes:
          type: [array, "null"]
          items: { type: string }
        roles:
          type: [array, "null"]
          items: { type: string }
        permissions:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: Map of resource type (or `*`) to allowed actions.
        anonymous: { type: boolean }
        jwt: { type: boolean, description: True when a validated principal is present. }
        rbac_enabled: { type: boolean }
    ListClustersResponse:
      type: object
      required: [clusters]
      properties:
        clusters:
          type: array
          items: { $ref: "#/components/schemas/ClusterInfo" }
    ClusterInfo:
      type: object
      required: [name, reachable, is_prod, auth_type, tls, schema_registry]
      properties:
        name: { type: string }
        reachable: { type: boolean }
        error: { type: string }
        is_prod: { type: boolean }
        auth_type: { type: string }
        tls: { type: boolean }
        schema_registry: { type: boolean }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        brokers:
          type: integer
          description: Aggregate metrics below are best-effort and absent until known.
        topics: { type: integer }
        groups: { type: integer }
        total_messages: { type: integer, format: int64 }
        total_lag: { type: integer, format: int64 }
        total_rate_per_sec: { type: number, format: double }
    Capabilities:
      type: object
      required: [describe_cluster, list_topics, describe_configs, list_groups, create_topic, delete_topic, alter_configs, probed_at]
      properties:
        describe_cluster: { type: boolean }
        list_topics: { type: boolean }
        describe_configs: { type: boolean }
        list_groups: { type: boolean }
        create_topic: { type: boolean }
        delete_topic: { type: boolean }
        alter_configs: { type: boolean }
        errors:
          type: object
          additionalProperties: { type: string }
        probed_at: { type: string, format: date-time }
    CapabilitiesResponse:
      type: object
      required: [cluster, capabilities]
      properties:
        cluster: { type: string }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
    BrokerInfo:
      type: object
      required: [node_id, host, port, is_controller]
      properties:
        node_id: { type: integer, format: int32 }
        host: { type: string }
        port: { type: integer, format: int32 }
        rack: { type: string }
        is_controller: { type: boolean }
    ListBrokersResponse:
      type: object
      required: [cluster, brokers]
      properties:
        cluster: { type: string }
        brokers:
          type: array
          items: { $ref: "#/components/schemas/BrokerInfo" }
    TopicInfo:
      type: object
      required: [name, partitions, replication_factor, is_internal]
      properties:
        name: { type: string }
        partitions: { type: integer }
        replication_factor: { type: integer }
        is_internal: { type: boolean }
        messages:
          type: integer
          format: int64
          description: Metric fields are best-effort and absent until known.
        size_bytes: { type: integer, format: int64 }
        retention_ms: { type: integer, format: int64, description: "-1 means infinite." }
        rate_per_sec: { type: number, format: double }
        lag: { type: integer, format: int64 }
    ListTopicsResponse:
      type: object
      required: [cluster, topics]
      properties:
        cluster: { type: string }
        topics:
          type: array
          items: { $ref: "#/components/schemas/TopicInfo" }
    CreateTopicRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }
        partitions: { type: integer, format: int32, description: "0 or -1 = broker default." }
        replication_factor: { type: integer, format: int32, description: "0 or -1 = broker default." }
        configs:
          type: object
          additionalProperties: { type: string }
    CreatedResponse:
      type: object
      required: [created]
      properties:
        created: { type: string }
    DeletedNameResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: string }
    DescribeTopicResponse:
      type: object
      required: [cluster, topic]
      properties:
        cluster: { type: string }
        topic: { $ref: "#/components/schemas/TopicDetail" }
    TopicDetail:
      type: object
      required: [name, is_internal, partitions, replication_factor, messages, configs]
      properties:
        name: { type: string }
        is_internal: { type: boolean }
        partitions:
          type: array
          items: { $ref: "#/components/schemas/PartitionInfo" }
        replication_factor: { type: integer }
        messages: { type: integer, format: int64 }
        configs:
          type: array
          items: { $ref: "#/components/schemas/TopicConfigEntry" }
        configs_error:
          type: string
          description: >
            Non-empty when DescribeConfigs failed for this topic and the
            `configs` array is incomplete. Known codes: `unauthorized`
            (missing DescribeConfigs ACL on the topic / cluster),
            `unavailable` (any other broker-side error).
        size_bytes: { type: integer, format: int64 }
    PartitionInfo:
      type: object
      required: [partition, leader, replicas, isr, start_offset, end_offset, messages]
      properties:
        partition: { type: integer, format: int32 }
        leader: { type: integer, format: int32 }
        replicas: { type: array, items: { type: integer, format: int32 } }
        isr: { type: array, items: { type: integer, format: int32 } }
        start_offset: { type: integer, format: int64 }
        end_offset: { type: integer, format: int64 }
        messages: { type: integer, format: int64 }
    TopicConfigEntry:
      type: object
      required: [name, value, is_default, sensitive]
      properties:
        name: { type: string }
        value: { type: string }
        is_default: { type: boolean }
        source: { type: string }
        sensitive: { type: boolean }
    AlterTopicConfigsRequest:
      type: object
      additionalProperties: false
      properties:
        set:
          type: object
          additionalProperties: { type: string }
        delete:
          type: array
          items: { type: string }
    AlterTopicConfigsResult:
      type: object
      required: [name, op]
      properties:
        name: { type: string }
        op: { type: string, enum: [set, delete] }
        value: { type: string }
        error: { type: string }
    AlterTopicConfigsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/AlterTopicConfigsResult" }
    TopicConsumer:
      type: object
      required: [group_id, state, members, partitions_assigned, lag, lag_known]
      properties:
        group_id: { type: string }
        state: { type: string }
        members: { type: integer }
        partitions_assigned:
          type: array
          items: { type: integer, format: int32 }
        lag: { type: integer, format: int64 }
        lag_known: { type: boolean }
        error: { type: string }
    ListTopicConsumersResponse:
      type: object
      required: [cluster, topic, consumers]
      properties:
        cluster: { type: string }
        topic: { type: string }
        consumers:
          type: array
          items: { $ref: "#/components/schemas/TopicConsumer" }
    DeleteRecordsRequest:
      type: object
      required: [partitions]
      additionalProperties: false
      properties:
        partitions:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: Map of partition id → offset to delete up to (-1 = high watermark).
    DeleteRecordsResult:
      type: object
      required: [partition, low_watermark, requested_offset]
      properties:
        partition: { type: integer, format: int32 }
        low_watermark: { type: integer, format: int64 }
        requested_offset: { type: integer, format: int64 }
        error: { type: string }
    DeleteRecordsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/DeleteRecordsResult" }
    SRDecodedMeta:
      type: object
      properties:
        format: { type: string, description: "`avro`, `protobuf` or `json_schema`." }
        schema_id: { type: integer }
        subject: { type: string }
        version: { type: integer }
    Message:
      type: object
      required: [partition, offset, timestamp_ms, key_encoding, value_encoding]
      properties:
        partition: { type: integer, format: int32 }
        offset: { type: integer, format: int64 }
        timestamp_ms: { type: integer, format: int64 }
        key: { type: string }
        key_encoding:
          type: string
          description: >
            How `key` is rendered: `null`, `empty`, `json`, `text`, `binary`
            (hex preview, raw bytes in `key_b64`) or a Schema Registry format
            (`avro`, `protobuf`, `json_schema`).
        key_b64: { type: string }
        value: { type: string }
        value_encoding:
          type: string
          description: Same values as `key_encoding`.
        value_b64: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
          description: >
            Header values as text. A value that is not valid UTF-8 is rendered
            as `0x…` hex here for display only — its raw bytes are in
            `headers_b64`.
        headers_b64:
          type: object
          additionalProperties: { type: string }
          description: >
            Standard-base64 raw bytes of header values that are not valid
            UTF-8. Only the affected keys appear; they also remain in `headers`
            with the hex rendering. Use this map to reproduce a header
            byte-for-byte (see the produce endpoint's `headers_b64`).
        masked: { type: boolean }
        value_size_bytes:
          type: integer
          format: int64
          description: Untruncated byte length of the raw value; absent for nil/empty values.
        value_truncated:
          type: boolean
          description: True when `value` holds only a preview; use the raw endpoint for the full bytes.
        key_sr: { $ref: "#/components/schemas/SRDecodedMeta" }
        value_sr: { $ref: "#/components/schemas/SRDecodedMeta" }
    MessagesPage:
      type: object
      required: [cluster, topic, messages, has_more]
      properties:
        cluster: { type: string }
        topic: { type: string }
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        has_more: { type: boolean }
        next_cursor: { type: string, description: Opaque cursor for the next page. }
        partial:
          type: boolean
          description: >
            True when a `from=end` page could not fully collect its tail window
            before the server-side timeout; the newest record(s) may be missing.
    ProduceRequest:
      type: object
      additionalProperties: false
      properties:
        partition:
          type: integer
          format: int32
          description: Explicit partition. Absent = key-based partitioning.
        key: { type: string }
        value: { type: string }
        key_encoding: { type: string, enum: [text, base64, empty], default: text }
        value_encoding: { type: string, enum: [text, base64, empty], default: text }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Header values as UTF-8 text.
        headers_b64:
          type: object
          additionalProperties: { type: string }
          description: >
            Header values as standard-base64 raw bytes, for headers
            whose value is not valid UTF-8. Wins over `headers` for the
            same key.
    ProduceResult:
      type: object
      required: [topic, partition, offset, timestamp_ms]
      properties:
        topic: { type: string }
        partition: { type: integer, format: int32 }
        offset: { type: integer, format: int64 }
        timestamp_ms: { type: integer, format: int64 }
    MessageCountPartition:
      type: object
      required: [partition, from_offset, to_offset, approx_count]
      properties:
        partition: { type: integer, format: int32 }
        from_offset: { type: integer, format: int64 }
        to_offset: { type: integer, format: int64 }
        approx_count: { type: integer, format: int64 }
    MessageCountResponse:
      type: object
      required: [cluster, topic, total_approx_count, partitions]
      properties:
        cluster: { type: string }
        topic: { type: string }
        from_ts_ms: { type: integer, format: int64 }
        to_ts_ms: { type: integer, format: int64 }
        total_approx_count: { type: integer, format: int64 }
        partitions:
          type: array
          items: { $ref: "#/components/schemas/MessageCountPartition" }
    MessageTimelineSlot:
      type: object
      required: [from_ts_ms, to_ts_ms, approx_count]
      properties:
        from_ts_ms: { type: integer, format: int64 }
        to_ts_ms: { type: integer, format: int64 }
        approx_count: { type: integer, format: int64 }
    MessageTimelineResponse:
      type: object
      required: [cluster, topic, from_ts_ms, to_ts_ms, slot_ms, slots]
      properties:
        cluster: { type: string }
        topic: { type: string }
        from_ts_ms: { type: integer, format: int64 }
        to_ts_ms: { type: integer, format: int64 }
        slot_ms: { type: integer, format: int64 }
        slots:
          type: array
          items: { $ref: "#/components/schemas/MessageTimelineSlot" }
    SampleResponse:
      type: object
      required: [cluster, topic, messages, sampled_at]
      properties:
        cluster: { type: string }
        topic: { type: string }
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        sampled_at: { type: integer, format: int64 }
    SearchRequest:
      type: object
      description: All fields are optional; server-side defaults apply.
      properties:
        partition: { type: integer, format: int32, description: "Absent or -1 = all partitions." }
        limit: { type: integer, description: Maximum matches to return. }
        budget: { type: integer, description: Maximum records to scan. }
        direction: { type: string, enum: [newest_first, oldest_first] }
        stop_on_limit: { type: boolean, default: true }
        mode: { type: string, enum: [contains, jsonpath, xpath, js] }
        path: { type: string, maxLength: 2048, description: JSONPath / XPath expression or JS filter source. }
        op: { type: string, enum: [exists, eq, ne, contains, regex, gt, lt, gte, lte] }
        value: { type: string }
        zones:
          type: array
          items: { type: string, enum: [value, key, headers] }
        from_ts_ms: { type: integer, format: int64 }
        to_ts_ms: { type: integer, format: int64 }
        cursors:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: Per-partition continuation offsets from `next_cursors`, keyed by partition id.
    PartitionRange:
      type: object
      required: [start, end]
      properties:
        start: { type: integer, format: int64 }
        end: { type: integer, format: int64 }
    ParseErrorOffset:
      type: object
      required: [partition, offset, error]
      properties:
        partition: { type: integer, format: int32 }
        offset: { type: integer, format: int64 }
        error: { type: string }
    SearchStats:
      type: object
      required: [scanned, matched, budget_exhausted, timed_out, more_available, direction, parse_errors]
      properties:
        scanned: { type: integer }
        matched: { type: integer }
        budget_exhausted: { type: boolean }
        timed_out: { type: boolean }
        more_available: { type: boolean }
        direction: { type: string, enum: [newest_first, oldest_first] }
        next_cursors:
          type: object
          additionalProperties: { type: integer, format: int64 }
        resolved_range:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PartitionRange" }
        parse_errors: { type: integer }
        parse_error_offsets:
          type: array
          items: { $ref: "#/components/schemas/ParseErrorOffset" }
        durations_ms:
          type: object
          additionalProperties: { type: integer, format: int64 }
    SearchResponse:
      type: object
      required: [cluster, topic, messages, search]
      properties:
        cluster: { type: string }
        topic: { type: string }
        messages:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/Message" }
        search: { $ref: "#/components/schemas/SearchStats" }
    CopyRequest:
      type: object
      required: [dest_topic]
      additionalProperties: false
      description: >
        Body of the topic copy endpoint. Exactly one of `dest_cluster` /
        `dest_cluster_config` must be set.
      properties:
        dest_cluster:
          type: string
          description: >
            Name of a server-configured destination cluster. Mutually exclusive
            with `dest_cluster_config`.
        dest_cluster_config:
          $ref: "#/components/schemas/ClusterConfig"
          description: >
            Ad-hoc ("private") destination cluster, same shape the
            `X-Kafkito-Cluster` header carries. Mutually exclusive with
            `dest_cluster`. Bypasses RBAC on the destination.
        dest_topic:
          type: string
          description: Destination topic. Must already exist.
        partition:
          type: integer
          format: int32
          description: Single source partition. Absent = all partitions.
        from_ts_ms:
          type: integer
          format: int64
          description: Inclusive lower bound on source record timestamps.
        to_ts_ms:
          type: integer
          format: int64
          description: >
            Exclusive upper bound on source record timestamps. When omitted the
            server substitutes the job's start time, so a copy of a live topic
            terminates instead of tailing it forever.
        limit:
          type: integer
          format: int64
          description: Maximum number of records to copy. Absent = no limit.
        preserve_partition:
          type: boolean
          description: >
            Produce each record to the same partition number it came from.
            Requires the destination topic to have at least as many partitions
            as the highest source partition, otherwise the request is rejected
            with 400.
    CopyProgressEvent:
      type: object
      required: [copied]
      description: >
        One SSE event of the copy stream, sent as a `data: {json}` line pair.
        Progress events arrive periodically — one right after the stream opens
        and at least one per fetched page — and the final event has
        `done: true`.
      properties:
        copied:
          type: integer
          format: int64
          description: Records produced to the destination topic so far.
        skipped:
          type: integer
          format: int64
          description: >
            Source records deliberately left out because they cannot be
            reproduced byte-for-byte (Schema-Registry-decoded or masked
            values). Omitted while 0.
        done:
          type: boolean
          description: True on the final event only; omitted otherwise.
        error:
          type: string
          description: >
            Set on the final event when the job aborted. Omitted when empty.
            Errors after the stream opened still carry HTTP status 200.
    ClusterConfig:
      type: object
      required: [brokers]
      description: >
        Ad-hoc ("private") cluster definition supplied per request instead of
        from the server config — the same JSON the `X-Kafkito-Cluster` header
        carries (base64-encoded there). Broker and Schema Registry hosts are
        subject to the server's outbound-host (SSRF) policy.
      properties:
        name: { type: string }
        is_prod: { type: boolean }
        brokers:
          type: array
          minItems: 1
          items: { type: string }
        auth:
          type: object
          properties:
            type:
              type: string
              enum: ["", none, plain, scram-sha-256, scram-sha-512]
              description: Case-insensitive. `plain` / `scram-*` require `username` and `password`.
            username: { type: string }
            password: { type: string, format: password }
        tls:
          type: object
          properties:
            enabled: { type: boolean }
            insecure_skip_verify: { type: boolean }
        schema_registry:
          type: object
          properties:
            url: { type: string }
            username: { type: string }
            password: { type: string, format: password }
            insecure_skip_verify: { type: boolean }
        data_masking:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/MaskingRule" }
    MaskingRule:
      type: object
      properties:
        topics: { type: array, items: { type: string } }
        fields:
          type: array
          items: { type: string }
          description: JSONPath expressions whose values are replaced.
        regex:
          type: array
          items:
            type: object
            properties:
              match: { type: string }
              replacement: { type: string }
        replacement: { type: string, description: 'Replacement for `fields`; empty = "***".' }
    GroupInfo:
      type: object
      required: [group_id, state, protocol_type, coordinator_id, members, lag, lag_known]
      properties:
        group_id: { type: string }
        state:
          type: string
          description: Broker-reported state, e.g. Stable, PreparingRebalance, CompletingRebalance, Empty, Dead.
        protocol_type: { type: string }
        protocol: { type: string, description: "e.g. range, roundrobin, cooperative-sticky." }
        coordinator_id: { type: integer, format: int32 }
        members: { type: integer, description: Member count. }
        topics: { type: integer }
        lag: { type: integer, format: int64 }
        lag_known: { type: boolean }
        error: { type: string }
    ListGroupsResponse:
      type: object
      required: [cluster, groups]
      properties:
        cluster: { type: string }
        groups:
          type: array
          items: { $ref: "#/components/schemas/GroupInfo" }
    MemberAssignment:
      type: object
      required: [topic, partitions]
      properties:
        topic: { type: string }
        partitions: { type: array, items: { type: integer, format: int32 } }
    GroupMember:
      type: object
      required: [member_id, client_id, client_host, assignments]
      properties:
        member_id: { type: string }
        instance_id: { type: string, description: "Static-membership group.instance.id, if configured." }
        client_id: { type: string }
        client_host: { type: string }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/MemberAssignment" }
    GroupOffset:
      type: object
      required: [topic, partition, offset, log_end, lag]
      properties:
        topic: { type: string }
        partition: { type: integer, format: int32 }
        offset: { type: integer, format: int64 }
        log_end: { type: integer, format: int64 }
        lag: { type: integer, format: int64 }
        metadata: { type: string }
        assigned_to:
          type: string
          description: "Current owner as `<client_id>@<host>`, absent during rebalance."
    GroupDetail:
      type: object
      description: >
        GroupInfo fields plus membership and offsets. `members` is the member
        list here, not the count from GroupInfo.
      required: [group_id, state, protocol_type, coordinator_id, members, offsets, lag, lag_known]
      properties:
        group_id: { type: string }
        state: { type: string }
        protocol_type: { type: string }
        protocol: { type: string }
        coordinator_id: { type: integer, format: int32 }
        topics: { type: integer }
        lag: { type: integer, format: int64 }
        lag_known: { type: boolean }
        error: { type: string }
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
        offsets:
          type: array
          items: { $ref: "#/components/schemas/GroupOffset" }
    CreateGroupRequest:
      type: object
      required: [group_id, topic, strategy]
      additionalProperties: false
      properties:
        group_id: { type: string }
        topic: { type: string }
        strategy:
          type: string
          enum: [earliest, latest, offset, timestamp]
        offset: { type: integer, format: int64, description: "Used with strategy=offset." }
        timestamp_ms: { type: integer, format: int64, description: "Used with strategy=timestamp." }
        dry_run: { type: boolean }
    ResetOffsetsRequest:
      type: object
      required: [topic, strategy]
      additionalProperties: false
      properties:
        topic: { type: string }
        partitions:
          type: array
          items: { type: integer, format: int32 }
          description: Absent or empty = all partitions of `topic`.
        strategy:
          type: string
          enum: [earliest, latest, offset, timestamp, shift-by]
        offset: { type: integer, format: int64, description: "Used with strategy=offset." }
        timestamp_ms: { type: integer, format: int64, description: "Used with strategy=timestamp." }
        shift: { type: integer, format: int64, description: "Used with strategy=shift-by." }
        dry_run: { type: boolean }
    ResetOffsetResult:
      type: object
      required: [partition, old_offset, new_offset, end_offset]
      properties:
        partition: { type: integer, format: int32 }
        old_offset: { type: integer, format: int64, description: "-1 if no prior commit." }
        new_offset: { type: integer, format: int64 }
        end_offset: { type: integer, format: int64, description: "Log-end offset, -1 if unknown." }
        error: { type: string }
    ResetOffsetsResponse:
      type: object
      required: [group, topic, dry_run, results]
      properties:
        group: { type: string }
        topic: { type: string }
        dry_run: { type: boolean }
        results:
          type: array
          items: { $ref: "#/components/schemas/ResetOffsetResult" }
    Subject:
      type: object
      required: [name, versions]
      properties:
        name: { type: string }
        versions: { type: array, items: { type: integer } }
        latest_schema_type: { type: string }
    ListSubjectsResponse:
      type: object
      required: [cluster, subjects]
      properties:
        cluster: { type: string }
        subjects:
          type: array
          items: { $ref: "#/components/schemas/Subject" }
    ListSchemaVersionsResponse:
      type: object
      required: [subject, versions]
      properties:
        subject: { type: string }
        versions:
          type: array
          items: { type: integer }
    SchemaReference:
      type: object
      required: [name, subject, version]
      properties:
        name: { type: string }
        subject: { type: string }
        version: { type: integer }
    SchemaVersion:
      type: object
      required: [subject, id, version, schemaType, schema]
      properties:
        subject: { type: string }
        id: { type: integer }
        version: { type: integer }
        schemaType: { type: string, description: "AVRO, JSON or PROTOBUF (may be empty for AVRO)." }
        schema: { type: string }
        references:
          type: array
          items: { $ref: "#/components/schemas/SchemaReference" }
        config:
          type: object
          properties:
            compatibilityLevel: { type: string }
    RegisterSchemaRequest:
      type: object
      required: [schema]
      additionalProperties: false
      properties:
        schema: { type: string }
        schemaType: { type: string, enum: [AVRO, JSON, PROTOBUF], description: Defaults to AVRO. }
        references:
          type: array
          items: { $ref: "#/components/schemas/SchemaReference" }
    RegisterSchemaResponse:
      type: object
      required: [id]
      properties:
        id: { type: integer }
    DeleteSubjectResponse:
      type: object
      required: [deleted, versions, permanent]
      properties:
        deleted: { type: string }
        versions:
          type: array
          items: { type: integer }
        permanent: { type: boolean }
    ACLEntry:
      type: object
      required: [principal, host, resource_type, resource_name, pattern_type, operation, permission_type]
      description: >
        ACL binding. As a request body it is a create spec or a delete filter.
        Enum-like fields are parsed case-insensitively by franz-go (`kmsg`).
      properties:
        principal: { type: string, example: "User:alice" }
        host: { type: string, example: "*" }
        resource_type: { type: string, example: TOPIC, description: "e.g. TOPIC, GROUP, CLUSTER, TRANSACTIONAL_ID, DELEGATION_TOKEN (ANY for filters)." }
        resource_name: { type: string }
        pattern_type: { type: string, example: LITERAL, description: "e.g. LITERAL, PREFIXED (ANY / MATCH for filters)." }
        operation: { type: string, example: READ, description: "e.g. READ, WRITE, CREATE, DELETE, ALTER, DESCRIBE, CLUSTER_ACTION, ALTER_CONFIGS, DESCRIBE_CONFIGS, IDEMPOTENT_WRITE, ALL." }
        permission_type: { type: string, example: ALLOW, description: "ALLOW or DENY (ANY for filters)." }
    ListACLsResponse:
      type: object
      required: [cluster, acls]
      properties:
        cluster: { type: string }
        acls:
          type: array
          items: { $ref: "#/components/schemas/ACLEntry" }
    CreateACLResponse:
      type: object
      required: [ok, acl]
      properties:
        ok: { type: boolean }
        acl: { $ref: "#/components/schemas/ACLEntry" }
    DeleteACLResponse:
      type: object
      required: [ok, deleted]
      properties:
        ok: { type: boolean }
        deleted: { type: integer, description: Number of deleted ACL bindings. }
    SCRAMCredential:
      type: object
      required: [mechanism, iterations]
      properties:
        mechanism: { type: string }
        iterations: { type: integer, format: int32 }
    SCRAMUser:
      type: object
      required: [user, credentials]
      properties:
        user: { type: string }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/SCRAMCredential" }
    ListSCRAMUsersResponse:
      type: object
      required: [cluster, users]
      properties:
        cluster: { type: string }
        users:
          type: array
          items: { $ref: "#/components/schemas/SCRAMUser" }
    UpsertSCRAMUserRequest:
      type: object
      required: [user, mechanism, password]
      properties:
        user: { type: string }
        mechanism: { type: string, enum: [SCRAM-SHA-256, SCRAM-SHA-512] }
        password: { type: string, format: password }
        iterations: { type: integer, format: int32, description: "0 = server default." }
    UpsertSCRAMUserResponse:
      type: object
      required: [ok, user, mechanism]
      properties:
        ok: { type: boolean }
        user: { type: string }
        mechanism: { type: string }
    DeleteSCRAMUserResponse:
      type: object
      required: [ok, user, deleted]
      properties:
        ok: { type: boolean }
        user: { type: string }
        deleted: { type: integer, description: Number of mechanisms deleted. }
