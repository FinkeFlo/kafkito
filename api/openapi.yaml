        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/v1/clusters/{cluster}/groups/{group}/reset-offsets:
    parameters:
