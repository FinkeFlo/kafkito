openapi: 3.1.0
info:
  title: kafkito REST API
  version: "1"
  summary: Read/write access to Kafka clusters managed by kafkito.
  description: |
    Stable JSON surface that backs the kafkito web UI. Suitable for scripting
    and development tooling.

    Authentication: kafkito forwards the `X-User` header to the configured
    RBAC policy. If RBAC is not configured the API is open. There is no
    built-in login — delegate authentication to a reverse proxy.

    Conventions:
    - All list endpoints return `{ "<resource>": [...] }` objects, never bare
      arrays, so new top-level fields can be added without breaking clients.
    - Timestamps are Unix milliseconds (int64) unless noted otherwise.
    - Error responses are `{ "error": "<short>", "detail": "<optional>" }`.
servers:
  - url: /
tags:
  - name: meta
    description: Build info, readiness, identity.
  - name: clusters
    description: Cluster inventory and capabilities.
  - name: topics
    description: Topic listing, describe, create, delete, produce, consume.
  - name: groups
    description: Consumer groups, members, offsets, reset.
  - name: schemas
    description: Schema Registry subjects and versions.
  - name: acls
    description: Kafka ACLs.
  - name: users
    description: SCRAM users.
paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness probe.
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: ok } }
  /readyz:
    get:
      tags: [meta]
      summary: Readiness probe. 503 if any configured cluster is unreachable.
      responses:
        "200": { description: All clusters reachable or none configured. }
        "503": { description: At least one cluster is unreachable. }
  /api/v1/info:
    get:
      tags: [meta]
      summary: Build info.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  version: { type: string }
  /api/v1/me:
    get:
      tags: [meta]
      summary: Resolved caller identity and effective permissions.
      responses:
        "200": { description: OK }
  /api/v1/clusters:
    get:
      tags: [clusters]
      summary: List configured clusters with reachability + capabilities.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  clusters:
                    type: array
                    items: { $ref: "#/components/schemas/ClusterInfo" }
  /api/v1/clusters/{cluster}/capabilities:
    get:
      tags: [clusters]
      summary: Cached capabilities (permissions probed against the broker).
      parameters: [ { $ref: "#/components/parameters/Cluster" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
  /api/v1/clusters/{cluster}/capabilities/refresh:
    post:
      tags: [clusters]
      summary: Re-probe capabilities (clears cache).
      parameters: [ { $ref: "#/components/parameters/Cluster" } ]
      responses:
        "200": { description: OK }
  /api/v1/clusters/{cluster}/topics:
    get:
      tags: [topics]
      summary: List topics.
      parameters: [ { $ref: "#/components/parameters/Cluster" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  topics:
                    type: array
                    items: { $ref: "#/components/schemas/TopicInfo" }
    post:
      tags: [topics]
      summary: Create a topic.
      parameters: [ { $ref: "#/components/parameters/Cluster" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTopicRequest" }
      responses:
        "201": { description: Created }
        "409": { description: Already exists }
  /api/v1/clusters/{cluster}/topics/{topic}:
    get:
      tags: [topics]
      summary: Describe a single topic (partitions, configs, watermarks).
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Topic" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicDetail" }
        "404": { description: Topic not found }
    delete:
      tags: [topics]
      summary: Delete a topic.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Topic" }
      responses:
        "204": { description: Deleted }
  /api/v1/clusters/{cluster}/topics/{topic}/consumers:
    get:
      tags: [topics]
      summary: Consumer groups that have committed offsets on this topic.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Topic" }
      responses:
        "200": { description: OK }
  /api/v1/clusters/{cluster}/topics/{topic}/records:
    delete:
      tags: [topics]
      summary: Delete records up to an offset per partition (low-watermark bump).
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Topic" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partitions:
                  type: object
                  additionalProperties: { type: integer, format: int64 }
                  description: Map of partition → offset to delete up to.
      responses:
        "200": { description: OK }
  /api/v1/clusters/{cluster}/topics/{topic}/messages:
    get:
      tags: [topics]
      summary: Consume recent messages from a topic.
      description: |
        Reads at most `limit` messages (capped at 500 server-side). Ordering is
        per-partition by offset ascending; the kafkito UI re-sorts on the
        client. Values are decoded into `value` when printable; when binary,
        `value_b64` is populated and `value_encoding=binary`. Schema-Registry
        encoded records are decoded transparently when a Schema Registry is
        configured for the cluster.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Topic" }
        - in: query
          name: partition
          schema: { type: integer, default: -1 }
          description: "-1 = all partitions."
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - in: query
          name: from
          schema: { type: string, enum: [latest, oldest, offset], default: latest }
        - in: query
          name: offset
          schema: { type: integer, format: int64 }
          description: Required when `from=offset`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
    post:
      tags: [topics]
      summary: Produce a single record.
      description: |
        `key_encoding` / `value_encoding` select how `key` / `value` are turned
        into record bytes:
        - `text` (default): the string is sent as UTF-8 bytes. An **empty**
          `text` value produces a **nil** payload, i.e. a tombstone — which
          deletes the key on a compacted topic.
        - `base64`: the string is base64-decoded (standard, URL-safe or raw
          standard are all accepted), for arbitrary binary payloads. An empty
          string produces a nil payload here too.
        - `empty`: the string is ignored and a non-nil **zero-length** payload
          is produced. Needed because `text` cannot express a zero-length
          payload (see the tombstone semantics above).

        Header values that are not valid UTF-8 cannot round-trip through
        `headers`; pass them as base64 raw bytes in `headers_b64` instead. A key
        present in both maps wins in `headers_b64` and is emitted exactly once.
        An undecodable `headers_b64` value fails the request with 400.

        kafkito always injects the provenance headers `X-Kafkito-Source: true`
        and, when an identity is available, `X-Kafkito-User: <subject>`,
        overwriting those keys if the request supplied them.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Topic" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partition: { type: integer }
                key: { type: string }
                value: { type: string }
                key_encoding: { type: string, enum: [text, base64, empty], default: text }
                value_encoding: { type: string, enum: [text, base64, empty], default: text }
                headers:
                  type: object
                  additionalProperties: { type: string }
                  description: Header values as UTF-8 text.
                headers_b64:
                  type: object
                  additionalProperties: { type: string }
                  description: >
                    Header values as standard-base64 raw bytes, for headers
                    whose value is not valid UTF-8. Wins over `headers` for the
                    same key.
      responses:
        "200": { description: Produced }
  /api/v1/clusters/{cluster}/topics/{topic}/messages/count:
    get:
      tags: [topics]
      summary: Approximate message volume for a topic range.
      description: |
        Resolves the selected timestamp window to per-partition offset deltas
        and returns an approximate count without consuming any records.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Topic" }
        - in: query
          name: partition
          schema: { type: integer, default: -1 }
          description: "-1 = all partitions."
        - in: query
          name: from_ts_ms
          schema: { type: integer, format: int64 }
          description: Optional lower timestamp bound in Unix milliseconds.
        - in: query
          name: to_ts_ms
          schema: { type: integer, format: int64 }
          description: Optional exclusive upper timestamp bound in Unix milliseconds.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageCountResponse" }
  /api/v1/clusters/{cluster}/topics/{topic}/messages/timeline:
    get:
      tags: [topics]
      summary: Time-sliced message volume over a time range for a topic.
      description: |
        Resolves the selected timestamp window into fixed-width time slots and
        returns an approximate message count per slot, without consuming
        any records. Used by the Timeline view to render a daily/hourly
        message-volume trend.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Topic" }
        - in: query
          name: partition
          schema: { type: integer, default: -1 }
          description: "-1 = all partitions."
        - in: query
          name: from_ts_ms
          required: true
          schema: { type: integer, format: int64 }
          description: Inclusive lower timestamp bound in Unix milliseconds.
        - in: query
          name: to_ts_ms
          required: true
          schema: { type: integer, format: int64 }
          description: Exclusive upper timestamp bound in Unix milliseconds.
        - in: query
          name: slot_ms
          required: true
          schema: { type: integer, format: int64 }
          description: Time-slot width in milliseconds (e.g. 3600000 for hourly, 86400000 for daily).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageTimelineResponse" }
        "400":
          description: Bad request (invalid range/slot or too many slots).
        "404":
          description: Unknown cluster.
        "403":
          description: Forbidden.
  /api/v1/clusters/{cluster}/topics/{topic}/sample:
    get:
      tags: [topics]
      summary: Sample the last n decoded messages from a topic.
      description: |
        Returns up to `n` (default 5, max 25) most recent decoded messages.
        Used by the search path-picker to build a structural sample of the
        topic payload. Reuses the consume permission for RBAC.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Topic" }
        - in: query
          name: n
          schema: { type: integer, minimum: 1, maximum: 25, default: 5 }
        - in: query
          name: partition
          schema: { type: integer, default: -1 }
          description: "-1 = all partitions."
      responses:
        "200":
          description: Sample fetched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cluster:    { type: string }
                  topic:      { type: string }
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  sampled_at: { type: integer, format: int64 }
        "400":
          description: Bad request (invalid n or partition).
        "404":
          description: Unknown cluster.
        "403":
          description: Forbidden.
  /api/v1/clusters/{cluster}/topics/{topic}/messages/search:
    post:
      tags: [topics]
      summary: Bounded, budget-limited content search across partitions.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Topic" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                zones:
                  type: array
                  items: { type: string, enum: [value, key, headers] }
                mode: { type: string, enum: [contains, regex, jsonpath] }
                direction: { type: string, enum: [forward, backward] }
                partitions:
                  type: array
                  items: { type: integer }
                limit: { type: integer }
                max_scan: { type: integer }
                timeout_ms: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
  /api/v1/clusters/{cluster}/topics/{topic}/copy:
    post:
      tags: [topics]
      summary: Bulk-copy messages into another topic (SSE progress stream).
      description: |
        Server-side copy: reads records from the source topic — the
        `{cluster}`/`{topic}` in the URL — and re-produces them into
        `dest_topic` on the destination cluster named in the request body.
        The destination topic must already exist; kafkito never creates it.

        Exactly one destination cluster field must be set: `dest_cluster` for a
        server-configured cluster, or `dest_cluster_config` for an ad-hoc
        ("private") cluster passed inline — the same payload the
        `X-Kafkito-Cluster` header carries.

        The response is **not** JSON: it is a `text/event-stream` of
        `CopyProgressEvent` objects, because a copy can run far longer than a
        normal request.

        When `to_ts_ms` is omitted the server substitutes the job's start time,
        so copying a live topic terminates instead of tailing it forever:
        records produced after the copy started are not included.

        Records that cannot be reproduced byte-for-byte are left out and
        counted in `skipped` instead of being copied approximately:
        Schema-Registry-decoded payloads (`avro` / `json_schema` /
        `protobuf`), for which only the decoded JSON rendering is available and
        the original wire-format bytes are gone, and masked records, whose
        value the source cluster's `data_masking` rules replaced with a
        redacted rendering.

        Copied records carry the same provenance headers the produce endpoint
        injects — `X-Kafkito-Source: true` and `X-Kafkito-User: <subject>` —
        overwriting those keys if the source record already had them.

        Authorization: the source needs `topic:consume` (checked by the RBAC
        middleware from the URL) and the destination needs `topic:produce`
        (checked by the handler against the cluster/topic named in the body).
        An ad-hoc `dest_cluster_config` destination **bypasses RBAC** — the
        caller supplies their own broker credentials and only that broker's own
        ACLs apply, so a user holding nothing but `topic:consume` can stream a
        readable topic to a broker of their choosing. This is a deliberate,
        pre-existing property of private clusters.

        The copy is neither transactional nor resumable: on error the records
        copied so far stay in the destination topic, and re-running the copy
        duplicates them.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Topic" }
        - in: header
          name: X-Kafkito-Confirm-Prod
          schema: { type: string, enum: ["true"] }
          description: >
            Must be `true` when the destination cluster is marked `is_prod`;
            the request is rejected with 428 otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyRequest" }
      responses:
        "200":
          description: |
            Copy job started; progress is streamed as Server-Sent Events. A
            failure *during* the copy also arrives here with status 200 — the
            SSE headers are already sent — as a final event carrying `error`.
            Clients must inspect the events, not just the status code.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/CopyProgressEvent" }
              example: |
                data: {"copied":0}

                data: {"copied":500,"skipped":3}

                data: {"copied":812,"skipped":5,"done":true}
        "400":
          description: >
            Invalid body, missing `dest_topic`, both or neither destination
            field set, destination equal to the source cluster+topic (the copy
            would never terminate), unknown `dest_cluster`, `dest_topic` does
            not exist on the destination (the destination is never
            auto-created), or `preserve_partition` with too few partitions on
            the destination topic.
        "403":
          description: RBAC denied consume on the source or produce on the destination.
        "428":
          description: >
            Destination cluster is marked `is_prod` and the
            `X-Kafkito-Confirm-Prod: true` header is missing.
        "429":
          description: >
            Too many concurrent copy jobs server-wide. The body carries
            `code: copy_concurrency_limit`. Copies are long-running and each
            holds broker connections, so the server sheds load rather than
            queueing.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema: { type: integer }
  /api/v1/clusters/{cluster}/groups:
    get:
      tags: [groups]
      summary: List consumer groups.
      parameters: [ { $ref: "#/components/parameters/Cluster" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/GroupInfo" }
    post:
      tags: [groups]
      summary: Create a consumer group bound to a topic.
      description: |
        Creates a new consumer group by committing initial offsets for all
        partitions of `topic` under the chosen strategy. Fails with 409 if the
        group already exists. `shift-by` is not accepted. Set `dry_run=true` to
        preview the resulting offsets without creating the group.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, topic, strategy]
              properties:
                group_id: { type: string }
                topic: { type: string }
                strategy:
                  type: string
                  enum: [earliest, latest, offset, timestamp]
                offset: { type: integer, format: int64 }
                timestamp_ms: { type: integer, format: int64 }
                dry_run: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetOffsetsResponse" }
        "409": { description: Group already exists }
  /api/v1/clusters/{cluster}/groups/{group}:
    get:
      tags: [groups]
      summary: Describe a consumer group (members, offsets, lag).
      description: |
        Returns full membership and per-partition committed offsets.
        `offsets[].assigned_to` is `<client_id>@<host>` of the current partition
        owner, or empty if the group is rebalancing.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Group" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
    delete:
      tags: [groups]
      summary: Delete a consumer group. Must be empty.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Group" }
      responses:
        "204": { description: Deleted }
  /api/v1/clusters/{cluster}/groups/{group}/reset-offsets:
    post:
      tags: [groups]
      summary: Reset committed offsets of a group.
      description: |
        Group must have no active members. Set `dry_run=true` to preview the
        resulting offsets without committing.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { $ref: "#/components/parameters/Group" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, strategy]
              properties:
                topic: { type: string }
                partitions:
                  type: array
                  items: { type: integer }
                strategy:
                  type: string
                  enum: [earliest, latest, offset, timestamp, shift-by]
                offset: { type: integer, format: int64 }
                timestamp_ms: { type: integer, format: int64 }
                shift: { type: integer, format: int64 }
                dry_run: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetOffsetsResponse" }
  /api/v1/clusters/{cluster}/schemas/subjects:
    get:
      tags: [schemas]
      summary: List Schema Registry subjects.
      parameters: [ { $ref: "#/components/parameters/Cluster" } ]
      responses: { "200": { description: OK } }
  /api/v1/clusters/{cluster}/schemas/subjects/{subject}/versions:
    get:
      tags: [schemas]
      summary: List versions of a subject.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { in: path, name: subject, required: true, schema: { type: string } }
      responses: { "200": { description: OK } }
    post:
      tags: [schemas]
      summary: Register a new version for a subject.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { in: path, name: subject, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses: { "200": { description: OK } }
  /api/v1/clusters/{cluster}/schemas/subjects/{subject}/versions/{version}:
    get:
      tags: [schemas]
      summary: Get a specific subject version (or `latest`).
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { in: path, name: subject, required: true, schema: { type: string } }
        - { in: path, name: version, required: true, schema: { type: string }, description: "Integer or `latest`." }
      responses: { "200": { description: OK } }
  /api/v1/clusters/{cluster}/schemas/subjects/{subject}:
    delete:
      tags: [schemas]
      summary: Soft-delete a subject.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { in: path, name: subject, required: true, schema: { type: string } }
      responses: { "204": { description: Deleted } }
  /api/v1/clusters/{cluster}/acls:
    get:
      tags: [acls]
      summary: List ACLs.
      parameters: [ { $ref: "#/components/parameters/Cluster" } ]
      responses: { "200": { description: OK } }
    post:
      tags: [acls]
      summary: Create an ACL.
      parameters: [ { $ref: "#/components/parameters/Cluster" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ACL" } } }
      responses: { "201": { description: Created } }
    delete:
      tags: [acls]
      summary: Delete ACL(s) matching a filter.
      parameters: [ { $ref: "#/components/parameters/Cluster" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ACL" } } }
      responses: { "200": { description: OK } }
  /api/v1/clusters/{cluster}/users:
    get:
      tags: [users]
      summary: List SCRAM users.
      parameters: [ { $ref: "#/components/parameters/Cluster" } ]
      responses: { "200": { description: OK } }
    post:
      tags: [users]
      summary: Create or update a SCRAM user.
      parameters: [ { $ref: "#/components/parameters/Cluster" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, mechanism, password]
              properties:
                user: { type: string }
                mechanism: { type: string, enum: [SCRAM-SHA-256, SCRAM-SHA-512] }
                password: { type: string, format: password }
                iterations: { type: integer }
      responses: { "200": { description: OK } }
  /api/v1/clusters/{cluster}/users/{user}:
    delete:
      tags: [users]
      summary: Delete a SCRAM user.
      parameters:
        - { $ref: "#/components/parameters/Cluster" }
        - { in: path, name: user, required: true, schema: { type: string } }
      responses: { "204": { description: Deleted } }
components:
  parameters:
    Cluster:
      in: path
      name: cluster
      required: true
      schema: { type: string }
      description: Cluster name from the kafkito config.
    Topic:
      in: path
      name: topic
      required: true
      schema: { type: string }
    Group:
      in: path
      name: group
      required: true
      schema: { type: string }
  schemas:
    ClusterInfo:
      type: object
      properties:
        name: { type: string }
        reachable: { type: boolean }
        error: { type: string }
        is_prod: { type: boolean }
        auth_type: { type: string }
        tls: { type: boolean }
        schema_registry: { type: boolean }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
    Capabilities:
      type: object
      properties:
        describe_cluster: { type: boolean }
        list_topics: { type: boolean }
        describe_configs: { type: boolean }
        list_groups: { type: boolean }
        create_topic: { type: boolean }
        delete_topic: { type: boolean }
        alter_configs: { type: boolean }
        errors:
          type: object
          additionalProperties: { type: string }
        probed_at: { type: string, format: date-time }
    TopicInfo:
      type: object
      properties:
        name: { type: string }
        partitions: { type: integer }
        replication_factor: { type: integer }
        is_internal: { type: boolean }
    CreateTopicRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        partitions: { type: integer, default: -1 }
        replication_factor: { type: integer, default: -1 }
        configs:
          type: object
          additionalProperties: { type: string }
    TopicDetail:
      type: object
      properties:
        name: { type: string }
        is_internal: { type: boolean }
        partitions:
          type: array
          items: { $ref: "#/components/schemas/PartitionInfo" }
        configs:
          type: array
          items: { $ref: "#/components/schemas/TopicConfigEntry" }
        configs_error:
          type: string
          description: >
            Non-empty when DescribeConfigs failed for this topic and the
            `configs` array is incomplete. Known codes: `unauthorized`
            (missing DescribeConfigs ACL on the topic / cluster),
            `unavailable` (any other broker-side error).
          enum: [unauthorized, unavailable]
    PartitionInfo:
      type: object
      properties:
        id: { type: integer }
        leader: { type: integer }
        replicas: { type: array, items: { type: integer } }
        isr: { type: array, items: { type: integer } }
        low_watermark: { type: integer, format: int64 }
        high_watermark: { type: integer, format: int64 }
    TopicConfigEntry:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
        source: { type: string }
        is_default: { type: boolean }
        is_read_only: { type: boolean }
        is_sensitive: { type: boolean }
    Message:
      type: object
      properties:
        partition: { type: integer }
        offset: { type: integer, format: int64 }
        timestamp_ms: { type: integer, format: int64 }
        key: { type: string }
        key_encoding: { type: string, enum: [text, binary, base64, empty, null] }
        key_b64: { type: string }
        value: { type: string }
        value_encoding: { type: string, enum: [json, text, binary, base64, empty, null, avro, protobuf, json_schema] }
        value_b64: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
          description: >
            Header values as text. A value that is not valid UTF-8 is rendered
            as `0x…` hex here for display only — its raw bytes are in
            `headers_b64`.
        headers_b64:
          type: object
          additionalProperties: { type: string }
          description: >
            Standard-base64 raw bytes of header values that are not valid
            UTF-8. Only the affected keys appear; they also remain in `headers`
            with the hex rendering. Use this map to reproduce a header
            byte-for-byte (see the produce endpoint's `headers_b64`).
        masked: { type: boolean }
        value_sr: { $ref: "#/components/schemas/SRDecodedMeta" }
        key_sr: { $ref: "#/components/schemas/SRDecodedMeta" }
    MessageCountPartition:
      type: object
      properties:
        partition: { type: integer }
        from_offset: { type: integer, format: int64 }
        to_offset: { type: integer, format: int64 }
        approx_count: { type: integer, format: int64 }
    MessageCountResponse:
      type: object
      properties:
        cluster: { type: string }
        topic: { type: string }
        from_ts_ms: { type: integer, format: int64 }
        to_ts_ms: { type: integer, format: int64 }
        total_approx_count: { type: integer, format: int64 }
        partitions:
          type: array
          items: { $ref: "#/components/schemas/MessageCountPartition" }
    MessageTimelineResponse:
      type: object
      properties:
        cluster: { type: string }
        topic: { type: string }
        from_ts_ms: { type: integer, format: int64 }
        to_ts_ms: { type: integer, format: int64 }
        slot_ms: { type: integer, format: int64 }
        slots:
          type: array
          items: { $ref: "#/components/schemas/MessageTimelineSlot" }
    MessageTimelineSlot:
      type: object
      properties:
        from_ts_ms: { type: integer, format: int64 }
        to_ts_ms: { type: integer, format: int64 }
        approx_count: { type: integer, format: int64 }
    SRDecodedMeta:
      type: object
      properties:
        schema_id: { type: integer }
        subject: { type: string }
        version: { type: integer }
        format: { type: string, enum: [avro, protobuf, json_schema] }
        error: { type: string }
    CopyRequest:
      type: object
      required: [dest_topic]
      description: >
        Body of the topic copy endpoint. Exactly one of `dest_cluster` /
        `dest_cluster_config` must be set.
      properties:
        dest_cluster:
          type: string
          description: >
            Name of a server-configured destination cluster. Mutually exclusive
            with `dest_cluster_config`.
        dest_cluster_config:
          allOf: [ { $ref: "#/components/schemas/ClusterConfig" } ]
          description: >
            Ad-hoc ("private") destination cluster, same shape the
            `X-Kafkito-Cluster` header carries. Mutually exclusive with
            `dest_cluster`. Bypasses RBAC on the destination.
        dest_topic:
          type: string
          description: Destination topic. Must already exist.
        partition:
          type: integer
          format: int32
          description: Single source partition. Absent = all partitions.
        from_ts_ms:
          type: integer
          format: int64
          description: Inclusive lower bound on source record timestamps.
        to_ts_ms:
          type: integer
          format: int64
          description: >
            Exclusive upper bound on source record timestamps. When omitted the
            server substitutes the job's start time, so a copy of a live topic
            terminates instead of tailing it forever.
        limit:
          type: integer
          format: int64
          description: Maximum number of records to copy. Absent = no limit.
        preserve_partition:
          type: boolean
          description: >
            Produce each record to the same partition number it came from.
            Requires the destination topic to have at least as many partitions
            as the highest source partition, otherwise the request is rejected
            with 400.
    CopyProgressEvent:
      type: object
      description: >
        One SSE event of the copy stream, sent as a `data: {json}` line pair.
        Progress events arrive periodically — one right after the stream opens
        and at least one per fetched page — and the final event has
        `done: true`.
      properties:
        copied:
          type: integer
          format: int64
          description: Records produced to the destination topic so far.
        skipped:
          type: integer
          format: int64
          description: >
            Source records deliberately left out because they cannot be
            reproduced byte-for-byte (Schema-Registry-decoded or masked
            values). Omitted while 0.
        done:
          type: boolean
          description: True on the final event only; omitted otherwise.
        error:
          type: string
          description: >
            Set on the final event when the job aborted. Omitted when empty.
            Errors after the stream opened still carry HTTP status 200.
    ClusterConfig:
      type: object
      required: [brokers]
      description: >
        Ad-hoc ("private") cluster definition supplied per request instead of
        from the server config — the same JSON the `X-Kafkito-Cluster` header
        carries (base64-encoded there).
      properties:
        name: { type: string }
        is_prod: { type: boolean }
        brokers: { type: array, items: { type: string } }
        auth:
          type: object
          properties:
            type: { type: string, enum: [none, plain, scram-sha-256, scram-sha-512] }
            username: { type: string }
            password: { type: string, format: password }
        tls:
          type: object
          properties:
            enabled: { type: boolean }
            insecure_skip_verify: { type: boolean }
        schema_registry:
          type: object
          properties:
            url: { type: string }
            username: { type: string }
            password: { type: string, format: password }
            insecure_skip_verify: { type: boolean }
    SearchResponse:
      type: object
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        stats:
          type: object
          properties:
            scanned: { type: integer }
            matched: { type: integer }
            budget_exhausted: { type: boolean }
            timed_out: { type: boolean }
            more_available: { type: boolean }
            direction: { type: string }
            parse_errors: { type: integer }
            next_cursors:
              type: object
              additionalProperties: { type: integer, format: int64 }
            durations_ms:
              type: object
              additionalProperties: { type: integer, format: int64 }
    GroupInfo:
      type: object
      properties:
        group_id: { type: string }
        state: { type: string, enum: [Stable, PreparingRebalance, CompletingRebalance, Empty, Dead, Unknown] }
        protocol_type: { type: string }
        protocol: { type: string, description: "e.g. range, roundrobin, cooperative-sticky." }
        coordinator_id: { type: integer }
        members: { type: integer }
        topics: { type: integer }
        lag: { type: integer, format: int64 }
        lag_known: { type: boolean }
        error: { type: string }
    GroupDetail:
      allOf:
        - $ref: "#/components/schemas/GroupInfo"
        - type: object
          properties:
            members:
              type: array
              items: { $ref: "#/components/schemas/GroupMember" }
            offsets:
              type: array
              items: { $ref: "#/components/schemas/GroupOffset" }
    GroupMember:
      type: object
      properties:
        member_id: { type: string }
        instance_id: { type: string, description: "Static-membership group.instance.id, if configured." }
        client_id: { type: string }
        client_host: { type: string }
        assignments:
          type: array
          items:
            type: object
            properties:
              topic: { type: string }
              partitions: { type: array, items: { type: integer } }
    GroupOffset:
      type: object
      properties:
        topic: { type: string }
        partition: { type: integer }
        offset: { type: integer, format: int64 }
        log_end: { type: integer, format: int64 }
        lag: { type: integer, format: int64 }
        metadata: { type: string }
        assigned_to:
          type: string
          description: "Current owner as `<client_id>@<host>`, empty during rebalance."
    ResetOffsetsResponse:
      type: object
      properties:
        group: { type: string }
        topic: { type: string }
        dry_run: { type: boolean }
        results:
          type: array
          items:
            type: object
            properties:
              partition: { type: integer }
              old_offset: { type: integer, format: int64 }
              new_offset: { type: integer, format: int64 }
              end_offset: { type: integer, format: int64 }
              error: { type: string }
    ACL:
      type: object
      properties:
        principal: { type: string, example: "User:alice" }
        host: { type: string, example: "*" }
        resource_type: { type: string, enum: [TOPIC, GROUP, CLUSTER, TRANSACTIONAL_ID, DELEGATION_TOKEN] }
        resource_name: { type: string }
        pattern_type: { type: string, enum: [LITERAL, PREFIXED] }
        operation: { type: string, enum: [READ, WRITE, CREATE, DELETE, ALTER, DESCRIBE, CLUSTER_ACTION, ALTER_CONFIGS, DESCRIBE_CONFIGS, IDEMPOTENT_WRITE, ALL] }
        permission_type: { type: string, enum: [ALLOW, DENY] }
