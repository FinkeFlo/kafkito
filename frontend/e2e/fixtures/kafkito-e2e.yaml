# kafkito config for `make e2e`: the same "local" cluster the
# KAFKITO_KAFKA_BROKERS shortcut would create, plus the data_masking rules
# masking.spec.ts walks against the e2e-masked and e2e-masked-kh fixture
# topics (seed.sh).
clusters:
  - name: local
    brokers: ["localhost:39092"]
    data_masking:
      - topics: ["^e2e-masked$"]
        fields: ["$.customer.email"]
      - topics: ["^e2e-masked-kh$"]
        targets: [key]
        regex:
          - match: "cust-e2e-[0-9]+"
            replacement: "cust-***"
      - topics: ["^e2e-masked-kh$"]
        targets: [headers]
        headers: ["^authorization$"]
        regex:
          - match: ".+"
