# golangci-lint version is pinned by GOLANGCI_LINT_VERSION in the Makefile;
# .github/workflows/ci.yml must use the same value (`make lint-version-check`).
version: "2"

run:
  timeout: 5m

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - testifylint
    - unparam

  settings:
    revive:
      rules:
        - name: exported

  exclusions:
    # Generated by oapi-codegen from api/openapi.yaml (make api-generate).
    paths:
      - ^internal/server/api/.*\.gen\.go$
    rules:
      # pending review, see #100
      - path: ^internal/auth/
        linters:
          - copyloopvar
          - errorlint
          - gocritic
          - testifylint
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - ^internal/server/api/.*\.gen\.go$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
