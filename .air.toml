# Live-reload config for kafkito backend (dev only).
# Schema: https://github.com/air-verse/air (verified against v1.65.x docs, 2026-04-30).
# Run via: `make dev` (Makefile pins the air version via AIR_VERSION).
# Air invocation under `make dev` is `go run github.com/air-verse/air@$(AIR_VERSION) -c .air.toml`.

root = "."
tmp_dir = "tmp"

# Per-worktree dev env. .env.dev is gitignored; written by `make worktree-init`.
# Air loads it before each build/run so air-from-IDE works without `make`.
env_files = [".env.dev"]

[build]
  cmd = "go build -tags devauth -o ./tmp/kafkito ./cmd/kafkito"
  entrypoint = ["./tmp/kafkito"]
  # The devauth build runs auth mode off, which the auth-mode guard only
  # allows on a loopback address. $PORT (from .env.dev) would override
  # server.addr with ":$PORT", and air re-adds it from env_files, so clear
  # it here and bind 127.0.0.1 on the port the Vite proxy targets.
  full_bin = "PORT= KAFKITO_SERVER_ADDR=127.0.0.1:${KAFKITO_BACKEND_PORT:-37421} ./tmp/kafkito"
  include_dir = ["cmd", "internal", "api"]
  include_ext = ["go", "yaml"]
  exclude_dir = ["frontend", "bin", "tmp", "dist", "node_modules", ".git", "deploy", "examples", "docs", ".worktrees"]
  exclude_regex = [
    "_test\\.go$",
    ".*_mock\\.go$",
  ]
  exclude_unchanged = true
  kill_delay = "500ms"
